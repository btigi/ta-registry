name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test src/TaRegistry.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/TaRegistry.Web/TaRegistry.Web.csproj
          -c Release
          -o publish/ta-registry
          -p:UseAppHost=false

      - name: Remove development settings
        run: rm -f publish/ta-registry/appsettings.Development.json

      - name: Archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          safe="${RELEASE_TAG//\//-}"
          echo "ARCHIVE=ta-registry-${safe}.zip" >> "$GITHUB_ENV"
          (cd publish && zip -r "../ta-registry-${safe}.zip" ta-registry)

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
